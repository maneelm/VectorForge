[project]
name = "vectorforge"
version = "0.1.0"
description = "Vector similarity search built from first principles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3"]

[project.optional-dependencies]
benchmark = [
    "faiss-cpu>=1.15.1,<2",
    "matplotlib>=3.9,<4",
    "psutil>=6,<8",
    "threadpoolctl>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
