[project]
name = "vectorforge"
version = "0.1.0"
description = "Vector similarity search built from first principles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.0,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1"]
benchmark = [
    "faiss-cpu>=1.15.1,<2",
    "matplotlib>=3.9,<4",
    "psutil>=6,<8",
    "threadpoolctl>=3.6,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "fastapi>=0.115,<1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
