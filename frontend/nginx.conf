# This template is rendered by the upstream image's envsubst startup hook.
map $uri $vectorforge_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    ~^/docs "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; style-src 'self' https://cdn.jsdelivr.net 'unsafe-inline'; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
}
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 4m;
    client_body_timeout 15s;
    send_timeout 30s;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:${VECTORFORGE_API_PORT};

    auth_basic "${VECTORFORGE_AUTH_REALM}";
    auth_basic_user_file /run/secrets/vectorforge_htpasswd;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy $vectorforge_csp always;
    gzip on;
    gzip_types text/css application/javascript application/json;

    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }
    location ~ ^/(api/|docs$|docs/oauth2-redirect$|openapi\.json$) {
        limit_req zone=api burst=40 nodelay;
        limit_req_status 429;
        proxy_pass $backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_read_timeout 190s;
        proxy_connect_timeout 5s;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"error":{"code":"body_too_large","message":"Request body exceeds 4 MiB."}}';
    }
}
